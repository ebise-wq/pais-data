<!-- Interactive "papers and trials per year, 24 diseases" chart for the catalog pages.
     tools/build_catalog.py inserts this into docs/index.html and docs/sources.html, replacing
     __DATA__ with {"trials": clinicaltrials/trials_per_year_*.csv and "papers": pubmed/pubs_per_year_long_*.csv
     (24 diseases; papers = the `title` column), "more": expanded/per_year_*.csv (the other 107 of the 120
     diseases; the 4 extra causes in that file are skipped), "burden": expanded/burden_interactive_2021-2025.json (DALYs, incl. ME/CFS and long COVID).
     Colours and fonts come from the page's tokens. Classes and ids start with py-. -->
<style>
.py { display: grid; gap: 1rem; min-width: 0; font-family: var(--f-body); }
.py-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1rem 0.9rem; min-width: 0; }
.py-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.7rem; }
.py-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.py-seg button { font: 500 0.9rem var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 999px;
  padding: 0.3rem 0.85rem; cursor: pointer; }
.py-seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.py-card h3 { font: 600 1.15rem/1.3 var(--f-display); margin: 0.1rem 0 0.15rem; }
.py-sub { font-size: 0.92rem; color: var(--muted); margin: 0 0 0.5rem; }
.py-plot { position: relative; width: 100%; min-height: 280px; }
.py svg { display: block; max-width: 100%; overflow: visible; }
.py svg text { font-family: var(--f-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.py svg text.lab { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; font-weight: 500; }
.py-tip { position: absolute; pointer-events: none; background: #0c2620; border: 1px solid var(--line); border-radius: 10px;
  padding: 0.5rem 0.7rem; font-size: 0.88rem; line-height: 1.45; color: var(--ink); min-width: 170px; z-index: 5;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); display: none; font-variant-numeric: tabular-nums; }
.py-tip b { display: block; margin-bottom: 0.15rem; }
.py-tip div { display: flex; justify-content: space-between; gap: 1rem; }
.py-tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.py-pick-h { font-size: 0.88rem; color: var(--muted); margin: 0.8rem 0 0.4rem; }
.py-pick button b { font-weight: 400; color: var(--faint); margin-left: 0.1rem; }
.py-add { margin-top: 0.6rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.py-add > summary { cursor: pointer; padding: 0.5rem 0.8rem; font-size: 0.92rem; color: var(--ink); }
.py-add input { width: calc(100% - 1.6rem); margin: 0 0.8rem 0.5rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; color: var(--ink); font: 400 0.95rem var(--f-body); padding: 0.4rem 0.6rem; }
.py-list { max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
.py-list button { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; gap: 1rem;
  padding: 0.4rem 0.8rem; font-size: 0.9rem; color: var(--ink); cursor: pointer; }
.py-list button:hover, .py-list button:focus-visible { background: var(--raise); }
.py-list button[aria-pressed="true"] { color: var(--muted); }
.py-list button[aria-pressed="true"] span::before { content: "✓ "; color: var(--sunset); }
.py-list small { color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.py-pick { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.py-pick button { font: 400 0.88rem var(--f-body); color: var(--muted); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 0.25rem 0.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
.py-pick button small { color: var(--faint); font-size: 0.8rem; }
.py-pick button[aria-pressed="true"] { color: var(--ink); background: var(--raise); border-color: var(--c); }
.py-pick button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: none; }
.py-pick button[aria-pressed="true"] i { display: inline-block; }
.py button:focus-visible { outline: 2px solid var(--sunset); outline-offset: 2px; }
.py-foot { font: 400 0.78rem var(--f-mono); color: var(--faint); display: flex; justify-content: space-between; gap: 1rem;
  flex-wrap: wrap; margin-top: 0.8rem; }
</style>
<div class="py" id="py">
  <div class="py-card">
    <div class="py-bar">
      <div class="py-seg" role="group" aria-label="Measure" data-k="m">
        <button type="button" data-v="papers" aria-pressed="true">Papers</button><button type="button" data-v="trials" aria-pressed="false">Trials</button>
      </div>
      <div class="py-seg" role="group" aria-label="Scale" data-k="log">
        <button type="button" data-v="1" aria-pressed="false">Log scale</button><button type="button" data-v="0" aria-pressed="true">Linear</button>
      </div>
    </div>
    <h3 id="py-title"></h3>
    <p class="py-sub" id="py-sub"></p>
    <div class="py-plot" id="py-plot"></div>
    <p class="py-pick-h">Shown (tap to remove). Number = global DALYs.</p>
    <div class="py-pick" id="py-pick"></div>
    <details class="py-add" id="py-add">
      <summary>Add diseases</summary>
      <input type="search" id="py-q" placeholder="Search, e.g. asthma" aria-label="Search diseases">
      <div class="py-list" id="py-list"></div>
    </details>
    <div class="py-foot"><span>ClinicalTrials.gov, PubMed · DALYs: GBD 2023; ME/CFS and long COVID from the ME/CFS model (CCC)</span><span>v4</span></div>
  </div>
</div>
<script>
(function () {
const root = document.getElementById("py");
if (!root) return;
const D = __DATA__;
const q = (s) => root.querySelector(s);
const Y0 = 1996, Y1 = 2025;  // 2026 is a partial year
const YEARS = []; for (let y = Y0; y <= Y1; y++) YEARS.push(y);
// Names in the 24-disease files -> labels in the 120-disease burden data
const ALIAS = { "HIV": "HIV/AIDS", "ALS (rare ref.)": "ALS / motor neuron disease", "ME/CFS": "All ME/CFS (classic + post-COVID)",
  "Long COVID": "Long COVID, incl. post-COVID ME", "Cystic fibrosis (rare ref.)": "Cystic fibrosis" };
const SHORT = { "All ME/CFS (classic + post-COVID)": "ME/CFS", "Long COVID, incl. post-COVID ME": "Long COVID",
  "ALS / motor neuron disease": "ALS", "Pre-eclampsia & hypertensive disorders of pregnancy": "Pre-eclampsia",
  "Fatty liver disease (NAFLD/MASLD)": "Fatty liver disease", "Interstitial lung disease & sarcoidosis": "Interstitial lung disease" };
const dalys = {}; D.burden.rows.forEach((r) => { dalys[r.label] = r.d; });
const series = {}, put = (d, k, i, v) => { const s = series[d] = series[d] || { papers: YEARS.map(() => null), trials: YEARS.map(() => null) }; s[k][i] = v; };
const key = (d) => ALIAS[d] || d;
D.trials.forEach((r) => YEARS.forEach((y, i) => put(key(r.disease), "trials", i, r[String(y)])));
D.papers.forEach((r) => { if (r.year >= Y0 && r.year <= Y1) put(key(r.disease), "papers", r.year - Y0, r.title); });
// The 4 causes left out of the 120-disease comparison (no DALYs in the burden data) are left out here too.
D.more.forEach((r) => { if (r.year >= Y0 && r.year <= Y1 && dalys[r.disease] != null) { put(r.disease, "papers", r.year - Y0, r.papers); put(r.disease, "trials", r.year - Y0, r.trials); } });
const ME_KEY = "All ME/CFS (classic + post-COVID)";
const name = (d) => SHORT[d] || d;
const all = Object.keys(series).sort((a, b) => (dalys[b] ?? -1) - (dalys[a] ?? -1) || a.localeCompare(b));
const ME = "#f2b880", PAL = ["#9fd8b5", "#8fb8e8", "#c9b8e8", "#e6a6c0", "#f2d38a", "#a8c97f", "#9fb4ff", "#e8c4a0"];
const S = { m: "papers", log: false, on: [ME_KEY, "Schizophrenia", "Epilepsy", "Osteoarthritis"].filter((d) => series[d]), col: {} };
const colour = (d) => {
  if (d === ME_KEY) return ME;
  if (!S.col[d]) { const used = new Set(Object.values(S.col)); S.col[d] = PAL.find((c) => !used.has(c)) || PAL[Object.keys(S.col).length % PAL.length]; }
  return S.col[d];
};
S.on.forEach(colour);
const fmtD = (v) => v >= 1e6 ? (v / 1e6 >= 10 ? Math.round(v / 1e6) : (v / 1e6).toFixed(1)) + "M" : Math.round(v / 1e3) + "k";
const fmt = (v) => v == null ? "–" : v.toLocaleString("en");

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function pick() {
  q("#py-pick").innerHTML = S.on.map((d) => `<button type="button" data-d="${esc(d)}" aria-pressed="true" style="--c:${colour(d)}"` +
    ` aria-label="Remove ${esc(name(d))}"><i></i>${esc(name(d))}` + (dalys[d] != null ? ` <small>${fmtD(dalys[d])}</small>` : "") + `<b>×</b></button>`).join("");
  list();
}
function list() {
  const t = q("#py-q").value.trim().toLowerCase();
  const hits = all.filter((d) => !t || d.toLowerCase().includes(t) || name(d).toLowerCase().includes(t));
  q("#py-list").innerHTML = hits.map((d) => `<button type="button" data-add="${esc(d)}" aria-pressed="${S.on.includes(d)}"><span>${esc(name(d))}</span>` +
    `<small>${dalys[d] != null ? fmtD(dalys[d]) + " DALYs" : "no GBD estimate"}</small></button>`).join("") ||
    `<p style="padding:0.4rem 0.8rem;color:var(--faint);margin:0">No match</p>`;
  q("#py-add summary").textContent = `Add diseases (${all.length})`;
}

function spread(items, top, bottom) {
  items.sort((a, b) => a.want - b.want);
  let y = top; items.forEach((it) => { it.y = Math.max(it.want, y); y = it.y + it.h; });
  if (y > bottom) { let yy = bottom; for (let i = items.length - 1; i >= 0; i--) { items[i].y = Math.min(items[i].y, yy - items[i].h); yy = items[i].y; } }
}

function draw() {
  const plot = q("#py-plot"), m = S.m;
  q("#py-title").textContent = m === "papers" ? "Papers per year" : "Trials per year";
  q("#py-sub").textContent = m === "papers"
    ? "PubMed papers with the disease in the title, 1996–2025."
    : "Interventional studies on ClinicalTrials.gov by start year, 1996–2025. Few trials were registered before 2005.";
  const W = plot.clientWidth || 640, H = Math.round(Math.min(460, Math.max(290, W * 0.62)));
  const on = S.on.filter((d) => series[d] && series[d][m]);
  // right margin fits the longest line label (about 7 px per character at 12.5 px)
  const M = { l: 46, r: Math.min(W * 0.4, 16 + 7 * Math.max(6, ...on.map((d) => name(d).length))), t: 10, b: 30 };
  let hi = 1; on.forEach((d) => series[d][m].forEach((v) => { if (v != null && v > hi) hi = v; }));
  const X = (y) => M.l + (y - Y0) / (Y1 - Y0) * (W - M.l - M.r);
  let Y, ticks = [];
  if (S.log) {
    let mn = hi; on.forEach((d) => series[d][m].forEach((v) => { if (v > 0 && v < mn) mn = v; }));
    const a0 = Math.floor(Math.log10(mn)), a1 = Math.log10(hi * 1.15);
    Y = (v) => H - M.b - ((Math.log10(v) - a0) / (a1 - a0)) * (H - M.t - M.b);
    const steps = a1 - a0 < 2.5 ? [1, 2, 5] : [1];
    for (let k = a0; k <= Math.ceil(a1); k++) steps.forEach((f) => { const t = f * 10 ** k; if (Math.log10(t) <= a1) ticks.push(t); });
  } else {
    const raw = hi / 4, mag = 10 ** Math.floor(Math.log10(raw)), st = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((x) => x >= raw);
    const top = Math.ceil(hi / st) * st;
    Y = (v) => H - M.b - (v / top) * (H - M.t - M.b);
    for (let v = 0; v <= top + 1e-9; v += st) ticks.push(v);
  }
  const big = (v) => v >= 1000 ? (v / 1000) + "k" : String(v);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m} per year for the selected diseases">`;
  if (m === "trials") s += `<rect x="${X(Y0)}" y="${M.t}" width="${X(2005) - X(Y0)}" height="${H - M.t - M.b}" fill="var(--bg)" opacity=".7"/>`;
  ticks.forEach((t) => { s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${M.l - 7}" y="${Y(t) + 4}" text-anchor="end" font-size="12">${big(t)}</text>`; });
  for (let y = 2000; y <= Y1; y += W < 560 ? 10 : 5) s += `<text x="${X(y)}" y="${H - M.b + 19}" text-anchor="middle" font-size="12">${y}</text>`;
  const labs = [];
  // draw ME/CFS last so it sits on top
  on.slice().sort((a, b) => (a === ME_KEY) - (b === ME_KEY)).forEach((d) => {
    const v = series[d][m], c = colour(d);
    let path = "", pen = false;
    v.forEach((x, i) => {
      if (x == null || (S.log && x <= 0)) { pen = false; return; }
      path += `${pen ? "L" : "M"}${X(YEARS[i]).toFixed(1)},${Y(x).toFixed(1)}`; pen = true;
    });
    s += `<path d="${path}" fill="none" stroke="${c}" stroke-width="${d === ME_KEY ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    let li = v.length - 1; while (li > 0 && (v[li] == null || (S.log && v[li] <= 0))) li--;
    if (v[li] != null && !(S.log && v[li] <= 0)) labs.push({ d, c, cy: Y(v[li]), want: Y(v[li]) - 7, h: 15 });
  });
  spread(labs, M.t, H - M.b + 8);
  labs.forEach((L) => { s += `<text class="lab" x="${W - M.r + 8}" y="${L.y + 11}" font-size="12.5" style="fill:${L.c}">${esc(name(L.d))}</text>`; });
  s += `<line id="py-cross" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  s += "</svg>";
  plot.innerHTML = s + `<div class="py-tip"></div>`;
  const svg = plot.querySelector("svg"), tip = plot.querySelector(".py-tip"), cross = svg.querySelector("#py-cross");
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
    const yr = Math.round(Y0 + (x - M.l) / (W - M.l - M.r) * (Y1 - Y0));
    if (yr < Y0 || yr > Y1 || !on.length) return hide();
    const i = yr - Y0;
    cross.setAttribute("x1", X(yr)); cross.setAttribute("x2", X(yr)); cross.setAttribute("visibility", "visible");
    const rows = on.map((d) => ({ d, v: series[d][m][i] })).sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
    tip.innerHTML = `<b>${yr}</b>` + rows.map((o) => `<div><span><i style="background:${colour(o.d)}"></i>${esc(name(o.d))}</span><span>${fmt(o.v)}</span></div>`).join("");
    tip.style.display = "block";
    const w = tip.offsetWidth;
    const left = X(yr) + 14 + w > W ? X(yr) - 14 - w : X(yr) + 14;
    tip.style.left = Math.max(0, Math.min(W - w, left)) + "px";
    tip.style.top = M.t + 4 + "px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("click", move);
  svg.addEventListener("pointerleave", hide);
}

function render() {
  root.querySelectorAll(".py-seg").forEach((g) => g.querySelectorAll("button").forEach((b) => {
    const v = g.dataset.k === "log" ? (b.dataset.v === "1") === S.log : b.dataset.v === S.m;
    b.setAttribute("aria-pressed", v);
  }));
  pick(); draw();
}
root.addEventListener("click", (ev) => {
  const b = ev.target.closest(".py-seg button");
  if (b) { const k = b.parentNode.dataset.k; if (k === "log") S.log = b.dataset.v === "1"; else S.m = b.dataset.v; return render(); }
  const c = ev.target.closest(".py-pick button");
  if (c) { const d = c.dataset.d; S.on = S.on.filter((x) => x !== d); delete S.col[d]; return render(); }
  const a = ev.target.closest(".py-list button");
  if (a) {
    const d = a.dataset.add;
    if (S.on.includes(d)) { S.on = S.on.filter((x) => x !== d); delete S.col[d]; } else { S.on.push(d); colour(d); }
    render();
  }
});
q("#py-q").addEventListener("input", list);
let lastW = 0;
new ResizeObserver(() => { const w = q("#py-plot").clientWidth; if (Math.abs(w - lastW) > 4) { lastW = w; draw(); } }).observe(q("#py-plot"));
render();
})();
</script>
